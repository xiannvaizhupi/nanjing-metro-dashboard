name: Update metro passenger flow

on:
  schedule:
    # GitHub 使用 UTC；北京时间 09:47 至 21:47 每小时错峰检查一次。
    # 避开常见整点/半点高峰，并用后续运行兜底 GitHub 可能延迟或丢弃的定时事件。
    - cron: '47 1-13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-metro-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate parser
        run: |
          python -m py_compile scripts/fetch_data.py scripts/ml_predictor.py
          python scripts/test_fetch_data.py
          python scripts/test_ml_predictor.py

      - name: Fetch latest passenger flow
        env:
          METRO_SKIP_GIT: '1'
          METRO_REQUIRE_YESTERDAY: '1'
        run: |
          set +e
          last_code=0
          for attempt in 1 2 3; do
            echo "Passenger-flow fetch attempt ${attempt}/3"
            python scripts/fetch_data.py
            code=$?

            if [ "$code" -eq 0 ]; then
              exit 0
            fi

            case "$code" in
              2)
                last_code=$code
                if [ "$attempt" -lt 3 ]; then
                  echo "Transient source failure (exit ${code}); retrying in 60 seconds."
                  sleep 60
                fi
                ;;
              3)
                echo "::notice::Yesterday's data has not been published yet; a later schedule will retry."
                exit 0
                ;;
              *)
                echo "::error::Fetcher stopped on a real data or program failure (exit ${code})."
                exit "$code"
                ;;
            esac
          done

          echo "::warning::All data sources are temporarily unavailable; a later schedule will retry."
          exit 0

      - name: Commit and push updates
        run: |
          if git diff --quiet -- data/metro_data.json data/prediction_log.json data/ml_predictions.json; then
            echo "No passenger flow updates to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metro_data.json data/prediction_log.json data/ml_predictions.json
          git commit -m "Auto update metro data - $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "GitHub push attempt ${attempt}/3 failed; retrying in 15 seconds."
              sleep 15
            fi
          done
          echo "::error::GitHub push failed after 3 attempts."
          exit 1

      - name: Sync current main to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::notice::GITEE_TOKEN is not configured; GitHub was updated and Gitee sync was skipped."
            exit 0
          fi
          git push "https://myles_zhu:${GITEE_TOKEN}@gitee.com/myles_zhu/nanjing-metro-data.git" HEAD:main
