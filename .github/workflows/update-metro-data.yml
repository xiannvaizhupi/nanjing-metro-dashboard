name: Update metro passenger flow

on:
  # 停止每日自动执行，避免抓取失败产生邮件通知；需要时可在 Actions 页面手动运行。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-metro-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate parser
        run: |
          python -m py_compile scripts/fetch_data.py scripts/ml_predictor.py
          python scripts/test_fetch_data.py
          python scripts/test_ml_predictor.py

      - name: Fetch latest passenger flow
        env:
          METRO_SKIP_GIT: '1'
        run: python scripts/fetch_data.py

      - name: Commit and push updates
        run: |
          if git diff --quiet -- data/metro_data.json data/prediction_log.json data/ml_predictions.json; then
            echo "No passenger flow updates to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metro_data.json data/prediction_log.json data/ml_predictions.json
          git commit -m "Auto update metro data - $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push
