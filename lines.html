<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线路详情 | 南京地铁客流数据</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="css/apple-style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="Nanjing_Metro_Logo.svg.png" alt="南京地铁" class="nav-logo">
                <span class="nav-title">南京地铁客流</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="lines.html" class="nav-link active">线路详情</a>
                <a href="history.html" class="nav-link">历史数据</a>
            </div>
            <button class="nav-menu-btn" onclick="toggleMobileMenu()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero" style="padding: 120px 24px 40px;">
        <h1 class="hero-title" style="font-size: clamp(32px, 6vw, 56px);">线路详情</h1>
        <p class="hero-subtitle">查看各条线路的客流趋势与统计</p>
    </section>

    <!-- Line Selector -->
    <section class="data-section" style="margin-top: 0;">
        <div class="data-card" style="opacity: 1;">
            <div class="data-card-title">
                <span>选择线路</span>
                <span class="data-card-badge" id="selectedLineName">--</span>
            </div>
            <div class="flex flex-wrap gap-3" id="lineSelector" style="padding: 8px 0;">
                <!-- Dynamic content -->
            </div>
        </div>
    </section>

    <!-- Line Stats -->
    <section class="data-section">
        <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr);" id="lineStats">
            <!-- Dynamic content -->
        </div>
    </section>

    <!-- Chart -->
    <section class="charts-section">
        <div class="chart-card" style="opacity: 1;">
            <div class="chart-header">
                <h2 class="chart-title">
                    <span id="chartLineName">线路</span> 客流趋势
                </h2>
                <div class="chart-tabs">
                    <button class="chart-tab" onclick="setLineTrendRange('week')">近一周</button>
                    <button class="chart-tab" onclick="setLineTrendRange('month')">近一月</button>
                    <button class="chart-tab" onclick="setLineTrendRange('year')">近一年</button>
                    <button class="chart-tab active" onclick="setLineTrendRange('all')">全部</button>
                </div>
            </div>
            <div class="chart-container" id="lineTrendChart"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-title">南京地铁</div>
            <p class="footer-text">持续更新 · 数据来源：南京地铁官方微博</p>
        </div>
    </footer>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="fixed inset-0 bg-black/50 z-50 hidden" onclick="toggleMobileMenu()">
        <div class="bg-white absolute bottom-0 left-0 right-0 rounded-t-3xl p-6" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <span class="text-lg font-semibold">菜单</span>
                <button onclick="toggleMobileMenu()" class="p-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="space-y-2">
                <a href="index.html" class="block py-3 px-4 rounded-lg hover:bg-gray-100">首页</a>
                <a href="lines.html" class="block py-3 px-4 rounded-lg bg-gray-100 font-medium">线路详情</a>
                <a href="history.html" class="block py-3 px-4 rounded-lg hover:bg-gray-100">历史数据</a>
            </div>
        </div>
    </div>

    <script>
        let metroData = null;
        let linesInfo = null;
        let currentLineId = 'L1';
        let lineTrendChart = null;
        let currentLineTrendRange = 'all';
        const ALL_LINES_ID = 'ALL';

        // Mobile menu
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            if (menu) menu.classList.toggle('hidden');
        }

        // Animate numbers
        function animateNumber(element, endValue, duration = 800) {
            if (!element) return;
            const startValue = parseFloat(element.textContent) || 0;
            const startTime = performance.now();
            const diff = endValue - startValue;
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                const current = startValue + (diff * easeProgress);
                element.textContent = current.toFixed(1);
                if (progress < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch('data/metro_data.json');
                const data = await response.json();
                metroData = data.daily_data;
                linesInfo = data.metadata.lines;
                
                initLineSelector();
                updateLineStats();
                initLineTrendChart();
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        });

        function initLineSelector() {
            const container = document.getElementById('lineSelector');
            let html = `
                <button onclick="selectLine('${ALL_LINES_ID}')" 
                    class="line-btn px-5 py-2.5 rounded-full font-medium transition-all duration-300"
                    data-line="${ALL_LINES_ID}"
                    style="background-color: ${currentLineId === ALL_LINES_ID ? '#007AFF' : '#f5f5f7'}; 
                           color: ${currentLineId === ALL_LINES_ID ? 'white' : '#1d1d1f'};">
                    所有线路
                </button>
            `;
            html += linesInfo.map(line => `
                <button onclick="selectLine('${line.id}')" 
                    class="line-btn px-5 py-2.5 rounded-full font-medium transition-all duration-300"
                    data-line="${line.id}"
                    style="background-color: ${line.id === currentLineId ? line.color : '#f5f5f7'}; 
                           color: ${line.id === currentLineId ? 'white' : '#1d1d1f'};">
                    ${line.name}
                </button>
            `).join('');
            
            container.innerHTML = html;
            updateSelectedLineName();
            updateStatsVisibility();
        }

        function updateSelectedLineName() {
            if (currentLineId === ALL_LINES_ID) {
                document.getElementById('selectedLineName').textContent = '所有线路';
                document.getElementById('chartLineName').textContent = '所有线路';
            } else {
                const lineInfo = linesInfo.find(l => l.id === currentLineId);
                document.getElementById('selectedLineName').textContent = lineInfo ? lineInfo.name : '--';
                document.getElementById('chartLineName').textContent = lineInfo ? lineInfo.name : '线路';
            }
        }

        function updateStatsVisibility() {
            const statsSection = document.getElementById('lineStats');
            const chartCard = document.querySelector('.charts-section .chart-card');
            const chartContainer = document.getElementById('lineTrendChart');
            
            if (currentLineId === ALL_LINES_ID) {
                statsSection.style.display = 'none';
                if (chartCard) {
                    chartCard.style.paddingTop = '32px';
                }
                if (chartContainer) {
                    chartContainer.style.height = '700px';
                }
                if (lineTrendChart) {
                    lineTrendChart.resize();
                }
            } else {
                statsSection.style.display = 'grid';
                if (chartCard) {
                    chartCard.style.paddingTop = '0';
                }
                if (chartContainer) {
                    chartContainer.style.height = '400px';
                }
                if (lineTrendChart) {
                    lineTrendChart.resize();
                }
            }
        }

        function selectLine(lineId) {
            currentLineId = lineId;
            
            document.querySelectorAll('.line-btn').forEach(btn => {
                const btnLineId = btn.dataset.line;
                if (btnLineId === currentLineId) {
                    if (btnLineId === ALL_LINES_ID) {
                        btn.style.backgroundColor = '#007AFF';
                    } else {
                        const line = linesInfo.find(l => l.id === btnLineId);
                        btn.style.backgroundColor = line ? line.color : '#007AFF';
                    }
                    btn.style.color = 'white';
                    btn.style.transform = 'scale(1.05)';
                } else {
                    btn.style.backgroundColor = '#f5f5f7';
                    btn.style.color = '#1d1d1f';
                    btn.style.transform = 'scale(1)';
                }
            });
            
            updateSelectedLineName();
            updateStatsVisibility();
            if (currentLineId !== ALL_LINES_ID) {
                updateLineStats();
            }
            updateLineTrendChart();
        }

        function getLineRangeData() {
            if (currentLineTrendRange === 'week') return metroData.slice(-7);
            if (currentLineTrendRange === 'month') return metroData.slice(-30);
            if (currentLineTrendRange === 'year') return metroData.slice(-365);
            return metroData;
        }

        function updateLineStats() {
            if (currentLineId === ALL_LINES_ID) return;
            
            const lineInfo = linesInfo.find(l => l.id === currentLineId);
            const rangeData = getLineRangeData();
            const values = rangeData.map(d => d.lines[currentLineId] || 0).filter(v => v > 0);
            
            if (values.length === 0) {
                document.getElementById('lineStats').innerHTML = '<div class="col-span-3 text-center text-gray-500">暂无数据</div>';
                return;
            }
            
            const max = Math.max(...values);
            const min = Math.min(...values);
            const avg = values.reduce((a, b) => a + b, 0) / values.length;
            
            const container = document.getElementById('lineStats');
            container.innerHTML = `
                <div class="stat-card" style="animation-delay: 0.1s; opacity: 1;">
                    <div class="stat-label">最高客流</div>
                    <div class="stat-value" id="statMax">${max.toFixed(1)}</div>
                    <div class="stat-note">万人次</div>
                </div>
                <div class="stat-card" style="animation-delay: 0.2s; opacity: 1;">
                    <div class="stat-label">最低客流</div>
                    <div class="stat-value" id="statMin">${min.toFixed(1)}</div>
                    <div class="stat-note">万人次</div>
                </div>
                <div class="stat-card" style="animation-delay: 0.3s; opacity: 1;">
                    <div class="stat-label">平均客流</div>
                    <div class="stat-value" id="statAvg">${avg.toFixed(1)}</div>
                    <div class="stat-note">万人次/日</div>
                </div>
            `;
        }

        function initLineTrendChart() {
            lineTrendChart = echarts.init(document.getElementById('lineTrendChart'));
            updateLineTrendChart();
            window.addEventListener('resize', () => lineTrendChart.resize());
        }

        function updateLineTrendChart() {
            const filteredData = getLineRangeData();
            const dates = filteredData.map(d => d.date.slice(5));
            
            let option;
            
            if (currentLineId === ALL_LINES_ID) {
                // Show all lines
                const seriesData = linesInfo.map((line, index) => ({
                    name: line.name,
                    type: 'line',
                    smooth: 0.6,
                    symbol: 'circle',
                    symbolSize: 4,
                    lineStyle: { color: line.color, width: 2 },
                    itemStyle: { color: line.color },
                    emphasis: { itemStyle: { symbolSize: 6 }, lineStyle: { width: 3 } },
                    animationDuration: 2000,
                    animationEasing: 'cubicOut',
                    data: filteredData.map(d => d.lines[line.id] || 0)
                }));
                
                option = {
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(255, 255, 255, 0.95)',
                        borderColor: '#e0e0e0',
                        textStyle: { color: '#1d1d1f' }
                    },
                    legend: {
                        type: 'scroll',
                        orient: 'vertical',
                        right: '2%',
                        top: 'center',
                        textStyle: { color: '#1d1d1f', fontSize: 11 },
                        itemGap: 6
                    },
                    grid: {
                        left: '3%',
                        right: '15%',
                        bottom: '15%',
                        top: '10%',
                        containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        data: dates,
                        axisLine: { lineStyle: { color: '#e0e0e0' } },
                        axisLabel: { color: '#86868b', rotate: 45 }
                    },
                    yAxis: {
                        type: 'value',
                        name: '万人次',
                        nameTextStyle: { color: '#86868b' },
                        axisLine: { show: false },
                        splitLine: { lineStyle: { color: '#f0f0f0' } },
                        axisLabel: { color: '#86868b' }
                    },
                    dataZoom: [
                        { type: 'inside', start: 0, end: 100 },
                        {
                            type: 'slider',
                            start: 0,
                            end: 100,
                            height: 20,
                            bottom: 5,
                            borderColor: 'transparent',
                            backgroundColor: '#f5f5f7',
                            fillerColor: 'rgba(120, 120, 128, 0.25)',
                            handleStyle: { color: '#787880', borderColor: '#787880' }
                        }
                    ],
                    series: seriesData
                };
            } else {
                // Show single line
                const lineInfo = linesInfo.find(l => l.id === currentLineId);
                const values = filteredData.map(d => d.lines[currentLineId] || 0);
                
                option = {
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(255, 255, 255, 0.95)',
                        borderColor: '#e0e0e0',
                        textStyle: { color: '#1d1d1f' },
                        formatter: function(params) {
                            const date = params[0].name;
                            const value = params[0].value;
                            return `<div style="padding: 8px;">
                                <div style="font-weight: 600; margin-bottom: 4px;">${date}</div>
                                <div><span style="display: inline-block; width: 10px; height: 10px; background: ${lineInfo.color}; border-radius: 50%; margin-right: 6px;"></span>${lineInfo.name}: <span style="font-weight: 700; color: ${lineInfo.color};">${value}万</span></div>
                            </div>`;
                        }
                    },
                    grid: {
                        left: '3%',
                        right: '4%',
                        bottom: '15%',
                        top: '10%',
                        containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        data: dates,
                        axisLine: { lineStyle: { color: '#e0e0e0' } },
                        axisLabel: { color: '#86868b', rotate: 45 }
                    },
                    yAxis: {
                        type: 'value',
                        name: '万人次',
                        nameTextStyle: { color: '#86868b' },
                        axisLine: { show: false },
                        splitLine: { lineStyle: { color: '#f0f0f0' } },
                        axisLabel: { color: '#86868b' }
                    },
                    dataZoom: [
                        { type: 'inside', start: 0, end: 100 },
                        {
                            type: 'slider',
                            start: 0,
                            end: 100,
                            height: 20,
                            bottom: 5,
                            borderColor: 'transparent',
                            backgroundColor: '#f5f5f7',
                            fillerColor: 'rgba(120, 120, 128, 0.25)',
                            handleStyle: { color: '#787880', borderColor: '#787880' }
                        }
                    ],
                    series: [{
                        data: values,
                        type: 'line',
                        smooth: 0.6,
                        symbol: 'circle',
                        symbolSize: 6,
                        lineStyle: { color: lineInfo.color, width: 3 },
                        itemStyle: { color: lineInfo.color },
                        areaStyle: {
                            color: {
                                type: 'linear',
                                x: 0, y: 0, x2: 0, y2: 1,
                                colorStops: [
                                    { offset: 0, color: lineInfo.color + '40' },
                                    { offset: 1, color: lineInfo.color + '05' }
                                ]
                            }
                        },
                        emphasis: { itemStyle: { symbolSize: 10 } },
                        animationDuration: 2000,
                        animationEasing: 'cubicOut'
                    }]
                };
            }
            
            lineTrendChart.setOption(option, true);
        }

        function setLineTrendRange(range) {
            currentLineTrendRange = range;
            document.querySelectorAll('.chart-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            updateLineTrendChart();
            if (currentLineId !== ALL_LINES_ID) {
                updateLineStats();
            }
        }
    </script>
</body>
</html>
