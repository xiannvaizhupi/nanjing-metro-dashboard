<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南京地铁客流数据 | Nanjing Metro Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="css/apple-style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="Nanjing_Metro_Logo.svg.png" alt="南京地铁" class="nav-logo">
                <span class="nav-title">南京地铁客流</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">首页</a>
                <a href="lines.html" class="nav-link">线路详情</a>
                <a href="history.html" class="nav-link">历史数据</a>
            </div>
            <button class="nav-menu-btn" onclick="toggleMobileMenu()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1 class="hero-title">南京地铁客流数据</h1>
        <p class="hero-subtitle">实时追踪地铁客流动态，智能预测出行趋势</p>
        <div class="hero-date">
            <span class="hero-date-dot"></span>
            <span id="heroDate">加载中...</span>
        </div>
    </section>

    <!-- Stats Section -->
    <section class="stats-section">
        <div class="stats-grid">
            <div class="stat-card primary" id="statTotal">
                <div class="stat-label">昨日总客流</div>
                <div class="stat-value" id="todayTotal">--</div>
                <div class="stat-indicator" id="todayChange">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">本月最高</div>
                <div class="stat-value" id="monthMax">--</div>
                <div class="stat-note" id="monthMaxDate">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">本月平均</div>
                <div class="stat-value" id="monthAvg">--</div>
                <div class="stat-note">万人次/日</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">今日预测</div>
                <div class="stat-value" id="predictedTotal">--</div>
                <div class="stat-note" id="predictedNote">预测中...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">明日预测</div>
                <div class="stat-value" id="predictedTomorrowTotal">--</div>
                <div class="stat-note" id="predictedTomorrowNote">预测中...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">数据更新</div>
                <div class="stat-value text-sm" id="lastUpdate">--</div>
                <div class="stat-note">每日上午更新</div>
            </div>
        </div>
    </section>

    <!-- Charts Section -->
    <section class="charts-section">
        <div class="chart-card">
            <div class="chart-header">
                <h2 class="chart-title">客流趋势</h2>
                <div class="chart-tabs">
                    <button class="chart-tab" onclick="setTrendRange('week')">近一周</button>
                    <button class="chart-tab" onclick="setTrendRange('month')">近一月</button>
                    <button class="chart-tab" onclick="setTrendRange('year')">近一年</button>
                    <button class="chart-tab active" onclick="setTrendRange('all')">全部</button>
                </div>
            </div>
            <div class="chart-container" id="trendChart"></div>
        </div>
    </section>

    <!-- Data Section -->
    <section class="data-section">
        <div class="data-grid">
            <!-- Line Details Table -->
            <div class="data-card">
                <div class="data-card-title">
                    <span id="selectedDateLabel">各线路客流</span>
                    <span class="data-card-badge">按客流排序</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>线路</th>
                                <th>客流(万)</th>
                                <th>占比</th>
                            </tr>
                        </thead>
                        <tbody id="linesTable">
                            <!-- Dynamic content -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Pie Chart -->
            <div class="data-card">
                <div class="data-card-title">
                    <span id="pieDateLabel">线路客流占比</span>
                    <span class="data-card-badge">可视化</span>
                </div>
                <div class="chart-container" id="pieChart"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-title">📢 数据说明</div>
            <p class="footer-text">数据自动从南京地铁官方微博抓取，每日更新</p>
            <p class="footer-text">当前数据范围：2025-01-01 至 昨天</p>
            <p class="footer-note">最后更新：<span id="footerUpdate">--</span></p>
        </div>
    </footer>

    <!-- Mobile Menu (Hidden by default) -->
    <div id="mobileMenu" class="fixed inset-0 bg-black/50 z-50 hidden" onclick="toggleMobileMenu()">
        <div class="bg-white absolute bottom-0 left-0 right-0 rounded-t-3xl p-6" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <span class="text-lg font-semibold">菜单</span>
                <button onclick="toggleMobileMenu()" class="p-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="space-y-2">
                <a href="index.html" class="block py-3 px-4 rounded-lg bg-gray-100 font-medium">首页</a>
                <a href="lines.html" class="block py-3 px-4 rounded-lg hover:bg-gray-100">线路详情</a>
                <a href="history.html" class="block py-3 px-4 rounded-lg hover:bg-gray-100">历史数据</a>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Mobile menu toggle
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        // Animate numbers on load
        function animateValue(element, start, end, duration) {
            if (start === end) return;
            const range = end - start;
            const startTime = performance.now();
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3); // ease-out cubic
                const current = start + (range * easeProgress);
                element.textContent = current.toFixed(1);
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            requestAnimationFrame(update);
        }

        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('revealed');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.scroll-reveal').forEach(el => {
            observer.observe(el);
        });

        // Add smooth transition to stat values
        document.querySelectorAll('.stat-value').forEach(el => {
            el.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
        });

        // Update hero date
        function updateHeroDate(date) {
            const el = document.getElementById('heroDate');
            if (el && date) {
                el.textContent = `${date} 客流数据`;
            }
        }
    </script>
</body>
</html>
